/* ================================
   PAGINA
================================ */

body {
    margin: 0;
    padding: 20px;

    background: #F1F8F3;

    color: #165d40;

}

h1,

}


/* ================================
   MENSAGEM DO RESULTADO
================================ */

.mensagem-resultado {
    width: 90%;
    max-width: 620px;

    margin: 20px auto 25px;

    text-align: center;
}

.mensagem-resultado h1 {
    margin: 0 0 10px;

    color: #165d40;

    font-size: 42px;
    font-weight: 500;
    line-height: 1;
}

.mensagem-resultado p {
    margin: 0;

    color: #165d40;

    font-size: 30px;
    line-height: 1.35;
}


/* ================================
   EDITOR / MOLDURA
================================ */

.editor {
    position: relative;

    width: 675px;
    max-width: 100%;

    margin: 0 auto;

    overflow: hidden;
}

.janelaFoto {
    position: absolute;

    left: 19%;
    top: 20%;

    width: 62%;
    height: 54%;

    overflow: hidden;

    z-index: 1;

    border-radius: 35px;
}

#moldura {
    position: relative;

    display: block;

    width: 100%;
    height: auto;

    z-index: 10;

    pointer-events: none;
}

#fotoNaMoldura {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    z-index: 1;

    display: none;

    touch-action: none;
    cursor: grab;

    transform-origin: center center;
}


/* ================================
   FOTO / GALERIA
================================ */

.botoes-foto {
    width: 90%;
    max-width: 380px;

    margin: 25px auto 10px;

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.botao {
    display: flex;

    width: 100%;

    box-sizing: border-box;

    align-items: center;
    justify-content: center;

    padding: 15px 24px;

    background: #165d40;
    color: #ffffff;

    border: none;
    border-radius: 30px;

    font-family: "Elbrush", Arial, sans-serif;

    font-size: 22px;
    font-weight: normal;

    text-align: center;

    cursor: pointer;

    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.14);
}

.botao:hover {
    transform: translateY(-2px);
}


/* ================================
   ZOOM
================================ */

label[for="zoom"] {
    display: block;

    margin: 12px auto 8px;

    color: #165d40;

    font-size: 20px;
}

#zoom {
    display: block;

    width: 80%;
    max-width: 340px;

    margin: 0 auto 20px;

    accent-color: #165d40;

    cursor: pointer;
}


/* ================================
   GUARDAR + INSTAGRAM
================================ */

#guardar,
#instagram {
    display: block;

    color: #ffffff;

}

#instagram:hover {
    transform: translateY(-2px);
}

   MOBILE
================================ */

<script>
const opcoesFotoMoldura =
    document.getElementById("opcoesFotoMoldura");
const fotoInput = document.getElementById("foto");
const cameraInput = document.getElementById("camera");
const fotoNaMoldura = document.getElementById("fotoNaMoldura");
const zoomInput = document.getElementById("zoom");
const zonaFinal = document.getElementById("zonaFinal");
const zonaZoom = document.getElementById("zonaZoom");

let estaAArrastar = false;
let inicioX = 0;
let inicioY = 0;
let posicaoX = 0;
let posicaoY = 0;
let zoom = 1;

function atualizarFotografia() {
    fotoNaMoldura.style.transform =
        `translate(calc(-50% + ${posicaoX}px), calc(-50% + ${posicaoY}px)) scale(${zoom})`;
}

function carregarFotografia(ficheiro) {
    if (!ficheiro) {
        return;
    }

    posicaoX = 0;
    posicaoY = 0;
    zoom = 1;

    zoomInput.value = 1;

    fotoNaMoldura.src = URL.createObjectURL(ficheiro);
    fotoNaMoldura.style.display = "block";


    atualizarFotografia();

zonaZoom.classList.remove("escondida");
document.getElementById("trocarFoto").style.display = "flex";
zonaFinal.classList.remove("escondida");

setTimeout(function () {
    zonaFinal.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}, 300);
}

fotoInput.addEventListener("change", function () {
    carregarFotografia(fotoInput.files[0]);
});

cameraInput.addEventListener("change", function () {
    carregarFotografia(cameraInput.files[0]);
});

fotoNaMoldura.addEventListener("pointerdown", function (evento) {
    estaAArrastar = true;

    inicioX = evento.clientX - posicaoX;
    inicioY = evento.clientY - posicaoY;

    fotoNaMoldura.setPointerCapture(evento.pointerId);
    fotoNaMoldura.style.cursor = "grabbing";
});

fotoNaMoldura.addEventListener("pointermove", function (evento) {
    if (!estaAArrastar) {
        return;
    }

    posicaoX = evento.clientX - inicioX;
    posicaoY = evento.clientY - inicioY;

    atualizarFotografia();
});

fotoNaMoldura.addEventListener("pointerup", function (evento) {
    estaAArrastar = false;

    if (fotoNaMoldura.hasPointerCapture(evento.pointerId)) {
        fotoNaMoldura.releasePointerCapture(evento.pointerId);
    }

    fotoNaMoldura.style.cursor = "grab";
});

zoomInput.addEventListener("input", function () {
    zoom = Number(zoomInput.value);
    atualizarFotografia();
});


const partilharBotao = document.getElementById("instagram");
const moldura = document.getElementById("moldura");


/* ==================================
   CRIAR IMAGEM FINAL
================================== */

function criarImagemFinal(callback) {

    if (!fotoNaMoldura.src) {
        alert("Escolhe ou tira uma fotografia primeiro.");
        return;
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = moldura.naturalWidth;
    canvas.height = moldura.naturalHeight;

    const escalaX = canvas.width / moldura.clientWidth;
    const escalaY = canvas.height / moldura.clientHeight;

    const janela = document.querySelector(".janelaFoto");
    const editor = document.querySelector(".editor");

    const janelaRect = janela.getBoundingClientRect();
    const editorRect = editor.getBoundingClientRect();

    const janelaX =
        (janelaRect.left - editorRect.left) * escalaX;

    const janelaY =
        (janelaRect.top - editorRect.top) * escalaY;

    const janelaLargura =
        janelaRect.width * escalaX;

    const janelaAltura =
        janelaRect.height * escalaY;


    /* RECORTE DA FOTOGRAFIA */

    ctx.save();

    ctx.beginPath();

    if (typeof ctx.roundRect === "function") {

        ctx.roundRect(
            janelaX,
            janelaY,
            janelaLargura,
            janelaAltura,
            35 * escalaX
        );

    } else {

        ctx.rect(
            janelaX,
            janelaY,
            janelaLargura,
            janelaAltura
        );
    }

    ctx.clip();


    /* PROPORÇÕES DA FOTOGRAFIA */

    const proporcaoImagem =
        fotoNaMoldura.naturalWidth /
        fotoNaMoldura.naturalHeight;

    const proporcaoCaixa =
        janelaLargura /
        janelaAltura;

    let sx;
    let sy;
    let sw;
    let sh;

    if (proporcaoImagem > proporcaoCaixa) {

        sh = fotoNaMoldura.naturalHeight;
        sw = sh * proporcaoCaixa;

        sx =
            (fotoNaMoldura.naturalWidth - sw) / 2;

        sy = 0;

    } else {

        sw = fotoNaMoldura.naturalWidth;
        sh = sw / proporcaoCaixa;

        sx = 0;

        sy =
            (fotoNaMoldura.naturalHeight - sh) / 2;
    }


    /* POSIÇÃO + ZOOM */

    const imagemLargura =
        janelaLargura * zoom;

    const imagemAltura =
        janelaAltura * zoom;

    const imagemX =
        janelaX +
        (janelaLargura - imagemLargura) / 2 +
        posicaoX * escalaX;

    const imagemY =
        janelaY +
        (janelaAltura - imagemAltura) / 2 +
        posicaoY * escalaY;


    /* DESENHAR FOTOGRAFIA */

    ctx.drawImage(
        fotoNaMoldura,
        sx,
        sy,
        sw,
        sh,
        imagemX,
        imagemY,
        imagemLargura,
        imagemAltura
    );

    ctx.restore();


    /* MOLDURA POR CIMA */

    ctx.drawImage(
        moldura,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GERAR PNG */

    canvas.toBlob(function (blob) {

        if (!blob) {
            alert("Não foi possível criar a imagem.");
            return;
        }

        callback(blob);

    }, "image/png");
}




/* ==================================
   PARTILHAR
================================== */

partilharBotao.addEventListener("click", function () {

    criarImagemFinal(async function (blob) {

        const ficheiro = new File(
            [blob],
            "a-minha-fruta-compal.png",
            {
                type: "image/png"
            }
        );

        const dadosPartilha = {
            files: [ficheiro]
        };

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare(dadosPartilha)
        ) {

            try {

                await navigator.share(dadosPartilha);

            } catch (erro) {

                if (erro.name !== "AbortError") {
                    console.error(erro);
                    alert(
                        "Não foi possível abrir a partilha neste dispositivo."
                    );
                }

            }

        } else {

            alert(
                "Neste dispositivo, guarda primeiro a fotografia e depois partilha-a através da aplicação que preferires."
            );

        }

    });

});

function mostrarResultadoFinal() {

    const zonaFinal =
        document.getElementById("zonaFinal");

    zonaFinal.style.display = "block";

    zonaFinal.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

</script>
